# ingestion.yaml — verification profile for ingestion work (plan §13.1)
profile: ingestion
description: Source adapters, queues, A→B→C→D gates, fixture replay, dedup smoke.
gates:
  - typecheck
  - adapter_test
  - fixture_replay
  - dedup_smoke
acceptance_criteria:
  - "Adapter/parser handles the edge case recorded in the mission."
  - "adapter_test passes via `npx vitest run 02-Ingestion/<gate>`."
  - "fixture_replay passes via `python3 Alltools-E2E/e2e.py --source <id> --limit 1`."
  - "dedup_smoke passes via `python3 tests/test_real_pipeline.py --source <id>`."
  - "No synthetic extraction in production CLIs (db.py, e2e.py)."
constraints:
  - "Do not modify 02-Ingestion/A-directAPI-networkGate/runA.ts interface."
  - "Do not change dedup hash algorithm."
  - "Adapters must run against real code paths; no synthetic extraction in production CLIs."
  - "Generalization Protection Rule: no IGNORE_PATTERNS or scoring weight changes based on a single site."
